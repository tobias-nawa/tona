<text x="16.0" y="369.5" textLength="672.0" fill="#828282">Decode&#160;on&#160;this&#160;PC,&#160;estimated&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="387.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;Coder&#160;&#160;&#160;2&#160;x&#160;128K&#160;&#160;&#160;15–63&#160;tok/s&#160;each,&#160;31–125&#160;together&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
