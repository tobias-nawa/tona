<text x="16.0" y="117.5" textLength="672.0" fill="#d4d4d4" font-weight="bold">How&#160;much&#160;may&#160;Tona&#160;take?&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="135.5" textLength="672.0" fill="#828282">What&#160;for&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="153.5" textLength="672.0" fill="#d4d4d4">▸&#160;Use&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(•)&#160;I&#160;work&#160;on&#160;this&#160;PC&#160;&#160;(&#160;)&#160;only&#160;for&#160;Tona,&#160;a&#160;server&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="171.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;Access&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(•)&#160;this&#160;PC&#160;only&#160;&#160;(&#160;)&#160;other&#160;PCs,&#160;with&#160;a&#160;key&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="189.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;Port&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;8662&#160;&#160;free&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="207.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;At&#160;login&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[&#160;]&#160;start&#160;the&#160;server&#160;(then&#160;it&#160;holds&#160;memory)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="243.5" textLength="672.0" fill="#828282">How&#160;much&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="261.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;When&#160;it&#160;gets&#160;tight&#160;&#160;(&#160;)&#160;work&#160;first&#160;&#160;(•)&#160;balanced&#160;&#160;(&#160;)&#160;Tona&#160;first&#160;&#160;(coming)&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="279.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;Parallel&#160;agents&#160;&#160;&#160;&#160;&#160;(&#160;)&#160;1&#160;&#160;(•)&#160;2&#160;&#160;(&#160;)&#160;3&#160;&#160;(&#160;)&#160;4&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="297.5" textLength="672.0" fill="#d4d4d4">&#160;&#160;Context&#160;per&#160;agent&#160;&#160;&#160;(•)&#160;auto&#160;&#160;(&#160;)&#160;64K&#160;&#160;(&#160;)&#160;128K&#160;&#160;(&#160;)&#160;256K&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="16.0" y="333.5" textLength="672.0" fill="#d4d4d4">Memory&#160;60&#160;GB&#160;&#160;&#160;██████████████████▒▒▒▒▒▒▒▒░░&#160;&#160;█&#160;Tona&#160;38&#160;▒&#160;yours&#160;18&#160;░&#160;system&#160;4&#160;&#160;&#160;&#160;</text>
