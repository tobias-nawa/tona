# Topics of the paper scan. `scan.py` reads this file; bump `version` whenever a topic or a query changes, so the
# coverage book (research/papers-coverage.md) shows which windows were searched with which topics.
#
# query:        arXiv search expression (all:/ti:/abs:/cat: with AND/OR), combined with the date window by scan.py
# categories:   optional arXiv categories, ANDed with the query
# github_terms: search terms for GitHub issues (one query per term and repo) and keywords that tag PRs and issues
version = 1

[[topic]]
id = "moe-offload"
title = "MoE offloading, expert cache, expert pruning"
query = '(ti:MoE OR abs:MoE OR abs:"mixture of experts" OR abs:"mixture-of-experts") AND (abs:offload OR abs:offloading OR abs:"expert cache" OR abs:"expert caching" OR abs:"expert prefetch" OR abs:prefetching OR abs:"expert pruning" OR abs:"expert placement" OR abs:"expert prediction" OR abs:"expert offloading" OR abs:"expert merging" OR abs:"expert routing")'
categories = ["cs.LG", "cs.CL", "cs.AR", "cs.DC", "cs.PF", "cs.AI", "cs.OS"]
github_terms = ["MoE offload", "expert cache", "expert offloading", "n-cpu-moe", "expert pruning"]

[[topic]]
id = "speculative"
title = "Speculative decoding, MTP, drafters"
query = 'abs:"speculative decoding" OR abs:"speculative sampling" OR abs:"multi-token prediction" OR abs:"draft model" OR abs:drafter OR abs:"self-speculative" OR abs:"tree attention" OR ti:speculative'
categories = ["cs.LG", "cs.CL", "cs.AR", "cs.DC", "cs.AI"]
github_terms = ["speculative decoding", "MTP", "multi-token prediction", "drafter", "DFlash", "EAGLE"]

[[topic]]
id = "linear-attention"
title = "Linear and sparse attention, DeltaNet, hybrids"
query = 'abs:DeltaNet OR abs:"Gated DeltaNet" OR abs:"linear attention" OR abs:"sparse attention" OR abs:"hybrid attention" OR abs:"state space model" OR abs:"recurrent state" OR abs:"sliding window attention" OR abs:"hybrid model"'
categories = ["cs.LG", "cs.CL", "cs.AR", "cs.DC", "cs.AI"]
github_terms = ["DeltaNet", "gated delta", "linear attention", "sparse attention", "Qwen3-Next", "hybrid model", "mamba"]

[[topic]]
id = "kv-cache"
title = "KV cache, prefix cache, agent serving"
query = '(abs:"KV cache" OR abs:"prefix cache" OR abs:"prefix caching" OR abs:"prompt cache" OR abs:"context caching") OR ((abs:agent OR abs:agentic) AND (abs:serving OR abs:inference OR abs:"tool call" OR abs:"multi-turn") AND (abs:latency OR abs:cache OR abs:throughput))'
categories = ["cs.LG", "cs.CL", "cs.AR", "cs.DC", "cs.PF", "cs.AI", "cs.OS"]
github_terms = ["KV cache", "prefix cache", "prompt cache", "slot save", "checkpoint cache", "context shift"]

[[topic]]
id = "quantization"
title = "Quantization of weights and KV, FP8/FP4, microscaling"
query = '(abs:quantization OR abs:quantized OR abs:"low-bit" OR abs:MXFP4 OR abs:NVFP4 OR abs:FP8 OR abs:FP4 OR abs:microscaling OR abs:"post-training quantization" OR abs:"1-bit" OR abs:"2-bit" OR abs:"KV quantization") AND (abs:LLM OR abs:LLMs OR abs:"language model" OR abs:"language models" OR abs:transformer OR abs:inference OR abs:GGUF OR abs:llama)'
categories = ["cs.LG", "cs.CL", "cs.AR", "cs.DC", "cs.AI"]
github_terms = ["quantization", "IQ1_M", "MXFP4", "FP8", "imatrix", "KV quant", "Q4_K"]

[[topic]]
id = "megakernel"
title = "Megakernels, persistent kernels, kernel fusion"
query = 'abs:megakernel OR abs:mega-kernel OR abs:"persistent kernel" OR abs:"kernel fusion" OR abs:"fused kernel" OR abs:"decode kernel" OR abs:"GPU kernel generation" OR abs:"CUDA graph"'
