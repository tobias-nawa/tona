name: CodeQL

# Advanced setup instead of the default setup, so the configuration lives in the repository.
# build-mode none: no build, the extractor reads the sources. CodeQL's C/C++ extractor does not list .hip (or .cu)
# among its file types, so the GPU kernels are not analysed; docs/contribute/github.md says what that leaves unchecked.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new queries find old code

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # The ruleset requires the check "CodeQL" (the code scanning results); the job names show per language.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read # the workflow run, for the analysis of private repositories
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
