name: release

# A tag vX.Y.Z builds the release assets and puts them into a DRAFT release with build attestations. Nothing here
# publishes and nothing here can sign: the maintainer checks the draft, signs the manifest on their own machine and
# publishes it (scripts/release-sign.sh, docs/maintain/release.md). No secrets are used; there is no pull_request trigger.
# The Linux build runs in the same pinned Fedora 44 image as tests.yml, the macOS (Apple silicon) build on a GitHub-hosted
# runner; the job `manifest` joins both into one manifest. GPU tests do not run here (no GPU on the runner).

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:a329903517f5dbd709721cba0cb1b6d0cc05f01b9e5feb59c2b6bbe9eb083ade
      # The runner's preinstalled SDKs, mounted so the job can delete them: the container shares the runner's disk,
      # which has only ~13 GB free, and the toolchain plus build need ~12 GB at the peak
      volumes:
        - /usr/share/dotnet:/runner-free/dotnet
        - /usr/local/lib/android:/runner-free/android
        - /opt/ghc:/runner-free/ghc
        - /opt/hostedtoolcache:/runner-free/toolcache
    steps:
      - name: Tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$TAG' is not vX.Y.Z" >&2; exit 1 ;;
          esac
      - name: Packages
        # openssl-devel: tona verifies signatures with OpenSSL
        run: dnf install -y --setopt=install_weak_deps=False gcc-c++ cmake ninja-build git python3 python3-pip openssl-devel gawk findutils tar diffutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        # The ROCm wheels unpack to ~7 GB and the build needs a few GB more (measured: 6.9 GB toolchain, 1.1 GB build). The runner has no GPU, so scripts/setup.sh
        # (which requires /dev/kfd) is not used; this does what it does for the toolchain, with the same hash-checked lock.
        run: |
          rm -rf /runner-free/*/* /runner-free/*/.[!.]*
          df -h /
          free_gb=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          [ "$free_gb" -ge 20 ] || { echo "only ${free_gb} GB free, the build needs ~20 GB" >&2; exit 1; }
      - name: Toolchain (ROCm 10.1, pinned with hashes)
        run: |
          python3 -m venv work/rocm-10.1
          # The venv's own pip (from Fedora's python3): an unpinned `pip install --upgrade pip` would be the one
          # dependency of the release build not checked against a hash
          work/rocm-10.1/bin/pip install --quiet --no-cache-dir --require-hashes -r toolchain/rocm-10.1.lock
          df -h /
      - name: Build the assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/release-build.sh "$RUNNER_TEMP/assets" --version "${TAG#v}" --work "$RUNNER_TEMP/work"
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-linux
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build-macos
    permissions:
      contents: read
    runs-on: macos-15 # arm64
    steps:
      - name: Tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$TAG' is not vX.Y.Z" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        run: brew install libomp openssl@3 ninja
      - name: Metal toolchain
        run: |
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Build the assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/release-build-macos.sh "$RUNNER_TEMP/assets" --version "${TAG#v}" --work "$RUNNER_TEMP/work"
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-macos
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: manifest
    needs: [build, build-macos]
    # Joins the two builds into one manifest and one SHA256SUMS. Reads the repository and the two artifacts, writes
    # nothing but its own artifact; the signature and the publication stay with the maintainer.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-linux
          path: parts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-macos
          path: parts/macos
      - name: Merge
        run: scripts/release-merge.sh "$RUNNER_TEMP/assets" parts/linux parts/macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft
    needs: manifest
    # The only job with write rights. It handles files, never source code: no checkout, no scripts from the repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Attest every asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The notes are the CHANGELOG.md section of the version, which release-build.sh put into the manifest (a build
          # without that section fails there). Reading them from the manifest keeps one source for the release page and
          # the update dialog, and this job runs no code from the repository.
          jq -er '.changelog | select(length > 0)' assets/manifest.json > notes.md
          {
            cat notes.md
            printf '\n%s\n' "Verify a download (signature and build attestation): docs/maintain/release.md, \"Check a release by hand\"."
          } > draft-notes.md  # no "draft" remark: an immutable release keeps its notes forever
          gh release create "$TAG" assets/* --repo "$REPO" --verify-tag --draft --title "$TAG" --notes-file draft-notes.md
